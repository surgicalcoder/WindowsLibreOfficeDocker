name: Build and Publish Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: surgicalcoder/dotnet-libreoffice
  DOTNET_VERSION: "10.0.3"

jobs:
  build:
    runs-on: windows-2025
    strategy:
      matrix:
        variant: [nanoserver, windowsservercore]
        version: [ltsc2022, ltsc2025]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare context
        run: |
          # Copy LibreOffice source into Docker build context
          Write-Host "Preparing LibreOffice files for Docker build context..."
          if (!(Test-Path "build-context")) {
            New-Item -ItemType Directory -Path "build-context" -Force
          }
          if (Test-Path "build-context\libreoffice") {
            Remove-Item "build-context\libreoffice" -Recurse -Force
          }
          Copy-Item "source\*" "build-context\libreoffice" -Recurse -Force
          Write-Host "LibreOffice files copied to build-context for Docker"

      - name: Set Dockerfile path
        id: vars
        run: |
          $dockerfile = "docker/base/Dockerfile.${{ matrix.variant }}-${{ matrix.version }}"
          echo "dockerfile=$dockerfile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build image
        run: |
          docker build `
            --file ${{ steps.vars.outputs.dockerfile }} `
            --build-arg DOTNET_VERSION=${{ env.DOTNET_VERSION }} `
            --tag ${{ env.IMAGE_NAME }}:${{ matrix.variant }}-${{ matrix.version }} `
            --pull `
            build-context

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ matrix.variant }}-${{ matrix.version }}